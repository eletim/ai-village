<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI村 · Agentワークスペース</title><link rel="stylesheet" href="/src/direct.css"></head>
<body><header><h1><small>AI VILLAGE</small> Agentワークスペース</h1><nav><button data-open="settings-dialog">起動・工房設定</button><button data-open="history-dialog">終了Agentの履歴</button><a href="/office">執務室 ↗</a></nav></header>
<main><div class="toolbar"><button data-launch>＋ Agentを起動</button><label>対象<select id="scope"><option value="all">全部</option><option value="workshop">工房</option><option value="agent">特定Agent</option></select></label><label id="place-filter">工房・場所<select id="place"></select></label><label id="agent-filter">Agent<select id="agent-choice"></select></label><label>同時表示<select id="layout"><option value="1">1 · 拡大</option><option value="2">2 · 分割</option><option value="4" selected>4 · 分割</option><option value="6">6 · 分割</option><option value="9">9 · 分割</option></select></label><div class="paging"><button id="previous" aria-label="前のパネル群">←</button><span id="page-count"></span><button id="next" aria-label="次のパネル群">→</button></div></div>
<p id="error" role="alert"></p><div id="agent-tabs" role="tablist" aria-label="Agentタブ"></div><div id="agents"></div><p id="empty" hidden>対象のAgentがいません。<button data-launch>この場所でAgentを起動</button></p></main>
<footer><span id="connection" role="status">接続中…</span><span id="notifications"></span><span>応答完了 ≠ 達成確認 · 閉じても監視を継続</span></footer>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>起動・工房設定</h2><button data-close>閉じる</button></div><p class="dialog-error" role="alert"></p><div class="settings"><section><h2>Agentを起動</h2><form id="agent-form"><label>配置先<select name="location"><option value="workshop">工房</option><option value="mayor">村長の家（秘書）</option></select></label><label>工房<select name="workshopId" required></select></label><label>作業場所<select name="cwd" required></select></label><label>Agentの種類<select name="provider"><option value="codex">Codex</option><option value="claude">Claude</option></select></label><label>Agent名<input name="name" value="Agent" required maxlength="120"></label><button>起動</button></form></section>
<section><h2>工房の設定</h2><div id="workshops"></div><form id="workshop-form"><h3 id="workshop-title">工房を登録</h3><input name="id" type="hidden"><label>名前<input name="name" required maxlength="120"></label><label>接続方式<select name="connectionType"><option value="ssh">SSH（別PC）</option><option value="local">ローカル（村長PC）</option></select></label><label id="ssh-host-field">SSH接続先<input name="sshHost" placeholder="E-frontier" required></label><label>PurpleMux URL<input name="baseUrl" type="url" required></label><label>作業場所（絶対パス・1行に1つ）<textarea name="workplaces" required rows="3"></textarea></label><button>保存</button><button type="button" id="reset-workshop" class="secondary">新規登録へ</button></form></section></div></dialog>
<dialog id="history-dialog"><div class="dialog-heading"><h2>終了Agentの会話履歴</h2><button data-close>閉じる</button></div><label>Agentを選ぶ<select id="history-agent"></select></label><div id="history-content"></div></dialog>
<script type="module" src="/src/direct.js"></script></body></html>
