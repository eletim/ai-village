<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI村 · 村長の家と工房</title><link rel="stylesheet" href="/src/direct.css"></head>
<body><header><div><small>AI VILLAGE</small><h1>村長の家と工房</h1><p>秘書と工房のAgentを、同じ画面で。</p></div><a href="/office">執務室・過去の会話へ</a></header>
<main><p id="error" role="alert"></p><p id="connection" role="status">接続中…</p><nav id="views" aria-label="表示する場所"></nav><div id="agents" class="locations"></div>
<section class="notice"><p>状態はランタイムのイベントから表示します。応答完了と依頼の達成は別です。ページを閉じても監視は続きます。</p><p id="notifications"></p></section>
<div class="settings"><section><h2>Agentを起動</h2><form id="agent-form"><label>配置先<select name="location"><option value="workshop">工房</option><option value="mayor">村長の家（秘書）</option></select></label><label>工房<select name="workshopId" required></select></label><label>作業場所<select name="cwd" required></select></label><label>Agentの種類<select name="provider"><option value="codex">Codex</option><option value="claude">Claude</option></select></label><label>Agent名<input name="name" value="Agent" required maxlength="120"></label><button>起動</button></form></section>
<section><h2>工房の設定</h2><div id="workshops"></div><form id="workshop-form"><h3 id="workshop-title">工房を登録</h3><input name="id" type="hidden"><label>名前<input name="name" required maxlength="120"></label><label>接続方式<select name="connectionType"><option value="ssh">SSH（別PC）</option><option value="local">ローカル（村長PC）</option></select></label><label id="ssh-host-field">SSH接続先<input name="sshHost" placeholder="E-frontier" required></label><label>PurpleMux URL<input name="baseUrl" type="url" required></label><label>作業場所（絶対パス・1行に1つ）<textarea name="workplaces" required rows="3"></textarea></label><button>保存</button><button type="button" id="reset-workshop" class="secondary">新規登録へ</button></form></section></div></main><script type="module" src="/src/direct.js"></script></body></html>
