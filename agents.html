<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI村 · 工房とAgent</title><link rel="stylesheet" href="/src/direct.css"></head>
<body><header><div><small>AI VILLAGE</small><h1>工房とAgent</h1><p>人間から直接指示。応答後も、同じAgentで続けられます。</p></div><a href="/office">執務室へ</a></header>
<main><p id="error" role="alert"></p><p id="connection" role="status">接続中…</p><div class="columns"><aside><section><h2>工房</h2><div id="workshops"></div><form id="workshop-form"><h3 id="workshop-title">工房を登録</h3><input name="id" type="hidden"><label>名前<input name="name" required maxlength="120"></label><label>SSH接続先<input name="sshHost" placeholder="E-frontier" required></label><label>PurpleMux URL<input name="baseUrl" type="url" placeholder="http://…:8022/" required></label><label>作業場所（絶対パス・1行に1つ）<textarea name="workplaces" required rows="3"></textarea></label><button>保存</button><button type="button" id="reset-workshop" class="secondary">新規登録へ</button></form></section>
<section><h2>Agentを起動</h2><form id="agent-form"><label>工房<select name="workshopId" required></select></label><label>作業場所<select name="cwd" required></select></label><label>Agent名<input name="name" value="Agent" required maxlength="120"></label><button>起動</button></form></section></aside><div><section class="notice"><h2>直接操作</h2><p>ページを閉じても、村長側バックエンドが監視と通知を続けます。応答完了は、依頼の達成を保証しません。</p><p id="notifications"></p></section><div id="agents"></div></div></div></main><script type="module" src="/src/direct.js"></script></body></html>
